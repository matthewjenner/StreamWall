<!doctype html>
<html><head><meta charset="utf-8"><title>Demo swap</title><link rel="stylesheet" href="/site.css">
<script src="/fakeplayer.js"></script></head>
<body>
<header>The player re-creates its video element every 8 seconds</header>
<div class="layout"><div class="main"><div id="player-host"></div></div><div class="chat"></div></div>
