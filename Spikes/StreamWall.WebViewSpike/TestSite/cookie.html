<!doctype html>
<html><head><meta charset="utf-8"><title>Demo cookie</title><link rel="stylesheet" href="/site.css">
<script src="/fakeplayer.js"></script></head>
<body>
<header>Sets the shared session cookie when asked to (?set=1)</header>
<div class="layout"><div class="main"><div id="player-host"></div></div></div>
<script>
  if (location.search.indexOf('set=1') >= 0 && window.__sw && window.__sw.runId) {
    document.cookie = 'sw_shared=' + window.__sw.runId + '; path=/; max-age=3600; Secure; SameSite=Lax';
  }
  FakePlayer.mount(document.getElementById('player-host'));
</script>
</body></html>
