<!doctype html>
<html><head><meta charset="utf-8"><title>Demo stream</title><link rel="stylesheet" href="/site.css">
<script src="/fakeplayer.js"></script></head>
<body>
<header>Demo site header and navigation</header>
<div class="layout">
  <div class="main"><div id="player-host"></div><h2>Stream title text</h2><p>Description text.</p></div>
  <div class="chat" id="chat"></div>
</div>
<div class="banner">Cookie banner overlay</div>
<script>
  FakePlayer.mount(document.getElementById('player-host'));
  const chat = document.getElementById('chat');
  setInterval(() => { const p = document.createElement('p'); p.textContent = 'chat line ' + Date.now(); chat.appendChild(p); }, 700);
</script>
</body></html>
