name: CI

# Quality gate on every push and PR: gitleaks over the full history (secrets, plus the
# non-placeholder-url rule that keeps the site out of the repo), and the .NET build + tests.
# The .NET job runs once the solution exists (M2); until then it reports that it was skipped.
# The release pipeline (release.yml, M6) is separate and only ships on version bumps.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so gitleaks can scan all commits
      # The gitleaks CLI directly, not gitleaks-action: the action scans only the pushed range
      # (and fails on a push containing the root commit) with an older gitleaks. This scans every
      # commit with the same version as the pre-commit hook. Bump with the local install.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "$base/$file"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $file\$" | sha256sum -c -
          tar -xzf "$file" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: gitleaks (full history)
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose

  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for the solution
        id: sln
        shell: bash
        run: |
          if [ -f StreamWall.slnx ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "StreamWall.slnx not scaffolded yet (M2); skipping build and tests."; fi
      - uses: actions/setup-dotnet@v6
        if: steps.sln.outputs.present == 'true'
        with:
          global-json-file: global.json
      - run: dotnet test --solution StreamWall.slnx --configuration Release
        if: steps.sln.outputs.present == 'true'
